# dsh-go manifest —— 对应 DSH 的 cordis.patch.yml
#
# 语义：按 id 命中；`enabled = false` 禁用；config 是**整块替换**而不是 merge。
# 激活顺序由能力依赖决定，本文件的书写顺序不承载语义。

[profile]
name = "default"

[[module]]
id      = "tools"
backend = "static"

[[module]]
id      = "exec"
backend = "static"

[[module]]
id      = "fs"
backend = "static"

[[module]]
id      = "tool-read"
backend = "static"

[[module]]
id      = "tool-write"
backend = "static"

[[module]]
id      = "tool-edit"
backend = "static"

[[module]]
id      = "tool-glob"
backend = "static"

[[module]]
id      = "tool-grep"
backend = "static"

[[module]]
id      = "history"
backend = "static"

[[module]]
id      = "tool-history"
backend = "static"

[[module]]
id      = "tool-wd"
backend = "static"

[[module]]
id      = "tool-todo"
backend = "static"

[[module]]
id      = "tool-present"
backend = "static"

[[module]]
id      = "tool-ask"
backend = "static"
